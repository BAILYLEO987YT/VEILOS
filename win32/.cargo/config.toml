# Overrides the kernel's x86_64-unknown-none target (../.cargo/config.toml).
# build-std from there is kept: core + compiler_builtins with the mem feature
# provide memcpy/memset, since these DLLs link no C runtime.
[build]
target = "x86_64-pc-windows-msvc"

[target.x86_64-pc-windows-msvc]
linker = "C:/Program Files/LLVM/bin/lld-link.exe"
