[package]
name = "w20tls"
version = "0.1.0"
edition = "2021"
description = "W20 (S4): a program carrying its own TLS (rustls) fetches pages over HTTPS"

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Not part of the VEILOS workspaces.
[workspace]
